name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify installer without publishing a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the ONNX Runtime API version expected by `ort` in src-tauri/Cargo.toml.
  ONNXRUNTIME_VERSION: '1.31.0'
  NUGET_ORT_URL: 'https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.31.0/microsoft.ml.onnxruntime.1.31.0.nupkg'

jobs:
  version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read and verify version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          GLORIA_VER=$(grep -E '^version\s*=' gloria.toml | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VER=$(grep -E '^version\s*=' src-tauri/Cargo.toml | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')

          if [[ -z "$GLORIA_VER" ]]; then
            echo "Failed to parse version from gloria.toml" >&2
            exit 1
          fi
          if [[ "$GLORIA_VER" != "$PKG_VER" || "$GLORIA_VER" != "$TAURI_VER" || "$GLORIA_VER" != "$CARGO_VER" ]]; then
            echo "Version mismatch: gloria.toml=$GLORIA_VER package.json=$PKG_VER tauri.conf.json=$TAURI_VER src-tauri/Cargo.toml=$CARGO_VER" >&2
            exit 1
          fi

          echo "version=${GLORIA_VER}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_VER=$(git show "${BEFORE}:gloria.toml" 2>/dev/null | grep -E '^version\s*=' | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/' || true)
          if [[ "$GLORIA_VER" != "$PREV_VER" ]]; then
            echo "Version changed: ${PREV_VER:-<none>} -> ${GLORIA_VER}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged (${GLORIA_VER}); skipping release build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows x64 installer
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run build

      - name: Fetch ONNX Runtime shared library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nupkg = Join-Path $env:TEMP 'ort.nupkg'
          Invoke-WebRequest -Uri $env:NUGET_ORT_URL -OutFile $nupkg
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
          try {
            $entryPath = 'runtimes/win-x64/native/onnxruntime.dll'
            $entry = $zip.GetEntry($entryPath)
            if (-not $entry) { throw "Missing entry $entryPath in ONNX Runtime package" }
            $dest = Join-Path (Resolve-Path 'src-tauri') 'onnxruntime.dll'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
          } finally {
            $zip.Dispose()
            Remove-Item -Force $nupkg
          }
          Get-Item 'src-tauri/onnxruntime.dll'

      - name: Build Tauri release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Stage application payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path app-dist) { Remove-Item -Recurse -Force app-dist }
          New-Item -ItemType Directory -Force -Path app-dist | Out-Null
          Copy-Item 'src-tauri/target/release/babbage.exe' 'app-dist/'
          Copy-Item 'src-tauri/onnxruntime.dll' 'app-dist/'
          Copy-Item -Recurse 'src-tauri/resources' 'app-dist/resources'
          Get-ChildItem app-dist

      - name: Pack installer with GloriaSetup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes gloria-setup@0.2.4 --app app-dist --manifest gloria.toml --version ${{ needs.version.outputs.version }} --out dist

      - name: Verify installer with silent dry-run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "dist\Babbage_${{ needs.version.outputs.version }}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer not found: $setup" }
          $proc = Start-Process -FilePath $setup -ArgumentList '/S --dry-run' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "GloriaSetup dry-run failed with exit code $($proc.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: babbage-windows-x64-installer
          path: dist/Babbage_${{ needs.version.outputs.version }}_x64-setup.exe
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: babbage-windows-x64-installer
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *_x64-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create, verify, and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          INSTALLER="Babbage_${VERSION}_x64-setup.exe"
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          gh release create "$TAG" \
            "release-assets/${INSTALLER}" \
            "release-assets/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --title "Babbage ${TAG}" \
            --generate-notes \
            --draft \
            "${PRERELEASE_FLAG[@]}"

          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && sha256sum --check SHA256SUMS.txt)
          rm -rf "$VERIFY_DIR"

          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false
